services:
  michibiki:
    build: .
    container_name: michibiki
    restart: unless-stopped
    environment:
      - SUWAYOMI_URL=http://suwayomi:4567/api/graphql
      - ANILIST_TOKEN=${ANILIST_TOKEN}
      - POLL_INTERVAL_SECONDS=86400
      - DRY_RUN=${DRY_RUN:-true}
      - BACKUP_DIR=/app/backups
      - MODE=watch
      - POPULATE_SUWAYOMI=true
      - CLEAR_SUWAYOMI_FIRST=false   # let it populate fresh, no old data to clear
    volumes:
      - ${MICHIBIKI_DATA_DIR:?set MICHIBIKI_DATA_DIR in .env (see .env.example)}:/app/data
      - ${BACKUP_HOST_DIR:?set BACKUP_HOST_DIR in .env (see .env.example)}:/app/backups
    depends_on:
      - suwayomi

  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:latest
    container_name: suwayomi
    restart: unless-stopped
    ports:
      - "4567:4567"
    volumes:
      - ${SUWAYOMI_DATA_DIR:?set SUWAYOMI_DATA_DIR in .env (see .env.example)}:/home/suwayomi/.local/share/Tachidesk
      - ${SUWAYOMI_CONFIG_DIR:?set SUWAYOMI_CONFIG_DIR in .env (see .env.example)}:/home/suwayomi/.local/share/Tachidesk-config
